# Source inventory — Module 3: Visa & Regulatory Change Monitor
# Phase 1 deliverable. Every source here is loaded into the `sources` table.
#
# Fields
#   key            unique short id (never change once data exists)
#   name           human-readable name shown in Tableau
#   agency         publishing body
#   url            page to monitor
#   category       visa_page | processing_times | news | policy | workplace
#   visa_hint      visa subclasses this page usually concerns (helps the LLM)
#   render         "static" (requests) or "js" (Playwright, for JS-rendered pages)
#   selector       optional CSS selector for the main content block
#   priority       1 = core (counts toward coverage KPI), 2 = secondary
#
# URLs checked 12 Oct 2026. Re-verify with `python scripts/check_sources.py` —
# government sites restructure pages from time to time.

sources:
  # ---------- Department of Home Affairs: visa pages ----------
  - key: ha_student_500
    name: Student visa (subclass 500)
    agency: Department of Home Affairs
    url: https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/student-500
    category: visa_page
    visa_hint: ["500"]
    render: static
    selector: main
    priority: 1

  - key: ha_graduate_485
    name: Temporary Graduate visa (subclass 485)
    agency: Department of Home Affairs
    url: https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/temporary-graduate-485
