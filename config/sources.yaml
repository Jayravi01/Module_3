  # ---------- Home Affairs: processing times + news ----------
  - key: ha_processing_times
    name: Global visa processing times
    agency: Department of Home Affairs
    url: https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-processing-times/global-visa-processing-times
    category: processing_times
    visa_hint: ["500", "485", "482", "600", "417"]
    render: js          # figures appear only after selecting a visa type in the page form
    selector: main
    priority: 2         # see README "Processing times" before relying on this source

  - key: ha_news
